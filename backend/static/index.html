<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hello</title>
  </head>
  <body style="font-family: sans-serif; color: #032147">
    <h1>Hello world</h1>
    <p id="result" style="color: #888888">Calling API...</p>
    <script>
      fetch("/api/hello")
        .then((r) => r.json())
        .then((d) => (document.getElementById("result").textContent = d.message));
    </script>
  </body>
</html>
